<!doctype html>
<html lang="he">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Psychometry Extraction Inspector</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>Psychometry Extraction Inspector</h1>
        <p>Local JSONL extraction/debug viewer</p>
      </div>
      <button id="randomRow" type="button">Random row</button>
    </header>

    <main>
      <section class="summary" aria-label="Summary">
        <div><span id="totalRows">0</span><small>total rows</small></div>
        <div><span id="visibleRows">0</span><small>visible rows</small></div>
        <div><span id="reviewRows">0</span><small>needs review</small></div>
        <div><span id="extraSummary">0</span><small id="extraSummaryLabel">multi-page</small></div>
      </section>

      <nav class="tabs" aria-label="Dataset">
        <button id="dictionaryTab" type="button" data-view="dictionary" aria-pressed="true">Dictionary</button>
        <button id="practiceTab" type="button" data-view="practice" aria-pressed="false">Practice Questions</button>
      </nav>

      <div id="warningBanner" class="warning" role="alert" hidden></div>

      <section class="controls" aria-label="Filters">
        <label>
          Search
          <input id="searchBox" type="search" dir="auto" placeholder="Search current dataset...">
        </label>
        <label>
          Unit
          <select id="unitFilter">
            <option value="">All units</option>
          </select>
        </label>
        <label id="typeFilterWrap">
          Exercise type
          <select id="typeFilter">
            <option value="">All types</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </label>
        <label class="check">
          <input id="reviewOnly" type="checkbox">
          <span>needs_review only</span>
        </label>
        <label id="multiPageWrap" class="check">
          <input id="multiPageOnly" type="checkbox">
          <span>page_start != page_end only</span>
        </label>
      </section>

      <div id="status" class="status" role="status"></div>

      <section class="table-wrap" aria-label="Extraction rows">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="entriesBody"></tbody>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
