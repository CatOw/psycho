<!doctype html>
<html lang="he">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Psychometry Hebrew POC</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <div>
          <p class="section-label">Hebrew</p>
          <h1>Psychometry Practice</h1>
        </div>
        <div class="top-actions">
          <button id="themeToggle" class="theme-toggle" type="button">Dark</button>
          <div id="loadState" class="load-state">Loading</div>
        </div>
      </header>

      <div id="warningBanner" class="warning" role="alert" hidden></div>

      <nav class="tab-bar" aria-label="Hebrew tabs">
        <button id="studyTab" type="button" data-tab="study" aria-pressed="true">Study</button>
        <button id="practiceTab" type="button" data-tab="practice" aria-pressed="false">Practice</button>
      </nav>

      <main>
        <section id="studyView" class="view" aria-labelledby="studyTab">
          <div class="sticky-panel">
            <label class="field">
              <span>Search dictionary</span>
              <input id="studySearch" type="search" dir="auto" autocomplete="off" placeholder="Search term, explanation, example">
            </label>
            <div class="filter-row">
              <label class="field">
                <span>Unit</span>
                <select id="studyUnit"></select>
              </label>
              <label class="check">
                <input id="studyExamplesOnly" type="checkbox">
                <span>With examples</span>
              </label>
            </div>
            <div class="study-actions">
              <button id="shuffleStudy" type="button">Shuffle</button>
              <button id="resetStudyOrder" type="button">Reset order</button>
            </div>
            <div id="studyCount" class="count-line"></div>
          </div>

          <div id="dictionaryCards" class="card-list" aria-live="polite"></div>
          <button id="loadMoreStudy" class="secondary-action" type="button">Load more</button>
          <button id="backToTop" class="floating-action" type="button" hidden>Top</button>
        </section>

        <section id="practiceView" class="view" aria-labelledby="practiceTab" hidden>
          <div id="practiceSetup" class="setup-panel">
            <section class="setup-card">
              <h2>Practice setup</h2>
              <p class="muted">Difficulty is provisional for now: units 1-7 easy, 8-14 medium, 15-20 hard.</p>
            </section>

            <section class="setup-card">
              <h3>Question types</h3>
              <div id="typeChoices" class="choice-grid"></div>
            </section>

            <section class="setup-card">
              <h3>Filters</h3>
              <div class="filter-row">
                <label class="field">
                  <span>Unit</span>
                  <select id="practiceUnit"></select>
                </label>
                <label class="field">
                  <span id="questionCountLabel">Question count</span>
                  <input id="questionCount" type="number" inputmode="numeric" min="1" step="1" placeholder="How many?">
                </label>
                <button id="useAllQuestions" type="button">Use all</button>
              </div>
              <p id="questionCountMessage" class="count-line"></p>
              <div id="difficultyChoices" class="choice-grid"></div>
            </section>

            <section class="setup-card">
              <h3>Mode</h3>
              <div class="choice-grid mode-grid">
                <label><input type="radio" name="practiceMode" value="untimed"> Questions without time</label>
                <label><input type="radio" name="practiceMode" value="perQuestionTimed"> Time per question</label>
                <label><input type="radio" name="practiceMode" value="simulation"> Simulation</label>
              </div>
              <p id="modeNote" class="muted"></p>
            </section>

            <section id="timingControls" class="setup-card timing-card" hidden>
              <h3 id="timingControlsTitle">Timing controls</h3>
              <div id="perQuestionTimingPanel" class="timing-panel">
                <div class="subsection">
                <p class="muted">Per-question timed mode</p>
                <div class="choice-grid compact-grid">
                  <label><input type="radio" name="perQuestionTimingMode" value="fixed"> Fixed</label>
                  <label><input type="radio" name="perQuestionTimingMode" value="byDifficulty"> By difficulty</label>
                </div>
                </div>
                <div id="perQuestionFixedFields" class="timing-grid">
                  <label class="field">
                    <span>Fixed question seconds</span>
                    <input id="fixedQuestionSeconds" type="number" min="1" step="1">
                  </label>
                </div>
                <div id="perQuestionDifficultyFields" class="timing-grid">
                  <label class="field">
                    <span>Easy seconds</span>
                    <input id="easyQuestionSeconds" type="number" min="1" step="1">
                  </label>
                  <label class="field">
                    <span>Medium seconds</span>
                    <input id="mediumQuestionSeconds" type="number" min="1" step="1">
                  </label>
                  <label class="field">
                    <span>Hard seconds</span>
                    <input id="hardQuestionSeconds" type="number" min="1" step="1">
                  </label>
                  <label class="field">
                    <span>Unknown seconds</span>
                    <input id="unknownQuestionSeconds" type="number" min="1" step="1">
                  </label>
                </div>
              </div>

              <div id="simulationTimingPanel" class="timing-panel">
                <div class="subsection">
                <p class="muted">Simulation timing</p>
                <div class="choice-grid compact-grid">
                  <label><input type="radio" name="simulationTimingMode" value="fixedTotal"> Fixed total</label>
                  <label><input type="radio" name="simulationTimingMode" value="perQuestion"> Seconds x questions</label>
                  <label><input type="radio" name="simulationTimingMode" value="byDifficulty"> By difficulty</label>
                </div>
                </div>
                <div id="simulationFixedFields" class="timing-grid">
                  <label class="field">
                    <span>Simulation total seconds</span>
                    <input id="simulationTotalSeconds" type="number" min="1" step="1">
                  </label>
                </div>
                <div id="simulationPerQuestionFields" class="timing-grid">
                  <label class="field">
                    <span>Simulation seconds/question</span>
                    <input id="simulationSecondsPerQuestion" type="number" min="1" step="1">
                  </label>
                </div>
                <div id="simulationDifficultyFields" class="timing-grid">
                  <label class="field">
                    <span>Simulation easy seconds</span>
                    <input id="simulationEasySeconds" type="number" min="1" step="1">
                  </label>
                  <label class="field">
                    <span>Simulation medium seconds</span>
                    <input id="simulationMediumSeconds" type="number" min="1" step="1">
                  </label>
                  <label class="field">
                    <span>Simulation hard seconds</span>
                    <input id="simulationHardSeconds" type="number" min="1" step="1">
                  </label>
                  <label class="field">
                    <span>Simulation unknown seconds</span>
                    <input id="simulationUnknownSeconds" type="number" min="1" step="1">
                  </label>
                </div>
              </div>
            </section>

            <section class="setup-card setup-summary">
              <div>
                <strong id="matchingCount">0</strong>
                <span>matching questions</span>
              </div>
              <button id="startPractice" type="button">Start untimed practice</button>
            </section>
          </div>

          <div id="practiceSession" class="practice-session" hidden></div>
        </section>
      </main>
    </div>

    <div id="lookupSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="lookupTitle" hidden>
      <button id="closeLookup" class="sheet-backdrop" type="button" aria-label="Close lookup"></button>
      <section class="sheet-panel">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h2 id="lookupTitle">Dictionary lookup</h2>
          <button id="closeLookupButton" type="button">Close</button>
        </div>
        <div id="lookupContent"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
